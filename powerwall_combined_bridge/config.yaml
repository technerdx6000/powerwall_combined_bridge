name: Powerwall Combined Bridge
version: 0.2.7
slug: powerwall_combined_bridge
description: >-
  Combine direct Tesla Powerwall v1r data from House A and House B with an
  optional Shelly 3-phase EM meter for Home Assistant.
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
url: https://github.com/technerdx6000/powerwall_combined_bridge
ports:
  8676/tcp: 8676
ports_description:
  8676/tcp: Combined energy JSON endpoint
watchdog: http://[HOST]:[PORT:8676]/health
webui: http://[HOST]:[PORT:8676]/
map:
  - addon_config:rw
  - homeassistant_config:rw
discovery:
  - powerwall_combined_bridge
hassio_role: manager
hassio_api: true
homeassistant_api: true
options:
  server_host: 0.0.0.0
  server_port: 8676
  refresh_interval: 5
  rsa_key_path: /config/tedapi_rsa_private.pem
  rsa_private_key_base64: ''
  powerwalls:
    - name: house_a
      host: 192.168.1.68
      din: 1707000-30-K--TG124347001PEX
    - name: house_b
      host: 192.168.1.59
      din: 1707000-30-K--TG1243480014GF
  shelly_enabled: true
  shelly_base_url: http://192.168.1.177
  shelly_em_id: 0
  shelly_auth_type: basic
  shelly_username: ''
  shelly_password: ''
schema:
  server_host: str
  server_port: port
  refresh_interval: int(5,300)
  rsa_key_path: str
  rsa_private_key_base64: password?
  powerwalls:
    - name: str
      host: str
      din: str
  shelly_enabled: bool
  shelly_base_url: str?
  shelly_em_id: int(0,10)
  shelly_auth_type: list(basic|digest)
  shelly_username: str?
  shelly_password: password?
homeassistant: 2026.9.0
stage: experimental
panel_icon: mdi:transmission-tower-export
panel_title: Powerwall Bridge